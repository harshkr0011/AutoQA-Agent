services:
  - type: web
    name: autoqa-agent
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: prod
      - key: BROWSER_HEADLESS
        value: "true"
      - key: MAX_CONCURRENT_RUNS
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: autoqa-agent-db
          property: connectionString

databases:
  - name: autoqa-agent-db
    databaseName: qa_agent
    user: autoqa_agent
    plan: free
    region: singapore
